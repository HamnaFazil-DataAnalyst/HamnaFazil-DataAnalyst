<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <rect width="640" height="400" fill="#1F2937"/>
  <rect x="20" y="20" width="600" height="360" rx="8" fill="#111827"/>
  <rect x="40" y="40" width="560" height="30" rx="4" fill="#374151"/>
  <circle cx="55" cy="55" r="5" fill="#EF4444"/>
  <circle cx="70" cy="55" r="5" fill="#F59E0B"/>
  <circle cx="85" cy="55" r="5" fill="#10B981"/>
  <text x="110" y="60" font-family="monospace" font-size="12" fill="#9CA3AF">retail_analysis.sql</text>
  <rect x="40" y="85" width="560" height="275" rx="4" fill="#0D1117"/>
  <text x="55" y="110" font-family="monospace" font-size="11" fill="#6B7280">-- Retail Performance Analysis</text>
  <text x="55" y="130" font-family="monospace" font-size="11" fill="#C678DD">WITH</text>
  <text x="90" y="130" font-family="monospace" font-size="11" fill="#E5C07B"> top_products</text>
  <text x="200" y="130" font-family="monospace" font-size="11" fill="#ABB2BF"> AS (</text>
  <text x="70" y="150" font-family="monospace" font-size="11" fill="#C678DD">SELECT</text>
  <text x="130" y="150" font-family="monospace" font-size="11" fill="#ABB2BF"> product_id,</text>
  <text x="70" y="170" font-family="monospace" font-size="11" fill="#C678DD">       SUM</text>
  <text x="130" y="170" font-family="monospace" font-size="11" fill="#ABB2BF">(revenue) AS total,</text>
  <text x="70" y="190" font-family="monospace" font-size="11" fill="#C678DD">       RANK</text>
  <text x="140" y="190" font-family="monospace" font-size="11" fill="#ABB2BF">() OVER (ORDER BY SUM(revenue) DESC)</text>
  <text x="70" y="210" font-family="monospace" font-size="11" fill="#C678DD">FROM</text>
  <text x="120" y="210" font-family="monospace" font-size="11" fill="#ABB2BF"> sales</text>
  <text x="70" y="230" font-family="monospace" font-size="11" fill="#C678DD">GROUP BY</text>
  <text x="150" y="230" font-family="monospace" font-size="11" fill="#ABB2BF"> product_id</text>
  <text x="55" y="250" font-family="monospace" font-size="11" fill="#ABB2BF">)</text>
  <text x="55" y="275" font-family="monospace" font-size="11" fill="#C678DD">SELECT</text>
  <text x="110" y="275" font-family="monospace" font-size="11" fill="#98C379">*</text>
  <text x="125" y="275" font-family="monospace" font-size="11" fill="#C678DD"> FROM</text>
  <text x="175" y="275" font-family="monospace" font-size="11" fill="#ABB2BF"> top_products WHERE rank &lt;= 15;</text>
  <rect x="40" y="310" width="560" height="50" rx="4" fill="#2563EB" opacity="0.15"/>
  <text x="55" y="340" font-family="monospace" font-size="11" fill="#2563EB">Result: Top 15% products ’ 78% of revenue</text>
  <text x="320" y="385" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#9CA3AF">SQL Retail Analysis Project</text>
</svg>
